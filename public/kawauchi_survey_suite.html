      "自分たちの活動場所として、清掃・草刈りや簡易な維持管理にはボランティアとして参加したい": "清掃・草刈りボランティア参加",
      "基本的にすべて行政や民間事業者に管理・運営を任せるべき": "行政・民間事業者に管理お任せ",
      "わからない / どちらともいえない": "わからない / どちらともいえない",
      "維持管理費を賄うためであれば、施設の利用料（有料化）を負担してもよい": "施設利用料(有料化)を負担してもよい",
      "役員などの固定的な負担ではなく、特技や興味（イベント企画・SNS発信・DIY等）を活かして関わりたい": "特技・興味(企画・SNS・DIY)で関与"
    };

    function shortBldg(v) { return BLDG_MAP[v] || v || '無回答'; }
    function shortPriv(v) { return PRIV_MAP[v] || v || '無回答'; }
    function shortFunc(v) { return FUNC_MAP[v] || v || '無回答'; }
    function shortSust(v) { return SUST_MAP[v] || v || '無回答'; }

    // ============================================================================
    // 2. 動的統計エンジン（RAW_DATAから全指標・ランキング・クロス表をリアルタイム算出）
    // ============================================================================
    function computeDynamicStats(rows) {
      const total = rows.length || 1;
      let webCount = 0;
      let paperCount = 0;
      const distSet = new Set();
      let commentCount = 0;
      let webCommentCount = 0;
      let paperCommentCount = 0;

      const bldgMap = {};
      const privMap = {};
      const funcMap = {};
      const sustMap = {};
      const ageMap = {};
      const distMap = {};

      let bldgValid = 0;
      let privValid = 0;
      let totalFuncVotes = 0;
      let totalSustVotes = 0;

      rows.forEach(r => {
        const isWeb = r.source === 'Web';
        if (isWeb) webCount++; else paperCount++;
        if (r.dist && r.dist !== '無回答') distSet.add(r.dist);
        if (r.comment && String(r.comment).trim()) {
          commentCount++;
          if (isWeb) webCommentCount++; else paperCommentCount++;
        }

        // Age
        const ageKey = r.age || '無回答';
        if (!ageMap[ageKey]) ageMap[ageKey] = { label: ageKey, total: 0, web: 0, paper: 0 };
        ageMap[ageKey].total++;
        if (isWeb) ageMap[ageKey].web++; else ageMap[ageKey].paper++;

        // District
        const dKey = r.dist || '無回答';
        if (!distMap[dKey]) distMap[dKey] = { label: dKey, total: 0, web: 0, paper: 0 };
        distMap[dKey].total++;
        if (isWeb) distMap[dKey].web++; else distMap[dKey].paper++;

        // Building (Q2)
        const bKey = shortBldg(r.bldg);
        if (bKey !== '無回答') bldgValid++;
        if (!bldgMap[bKey]) bldgMap[bKey] = { label: bKey, raw: r.bldg, total: 0, web: 0, paper: 0 };
        bldgMap[bKey].total++;
        if (isWeb) bldgMap[bKey].web++; else bldgMap[bKey].paper++;

        // Private (Q4)
        const pKey = shortPriv(r.priv);
        if (pKey !== '無回答') privValid++;
        if (!privMap[pKey]) privMap[pKey] = { label: pKey, raw: r.priv, total: 0, web: 0, paper: 0 };
        privMap[pKey].total++;
        if (isWeb) privMap[pKey].web++; else privMap[pKey].paper++;

        // Functions (Q3)
        (r.funcs || []).forEach(f => {
          const fKey = shortFunc(f);
          if (!fKey || fKey === '無回答') return;
          totalFuncVotes++;
          if (!funcMap[fKey]) funcMap[fKey] = { label: fKey, total: 0, web: 0, paper: 0 };
          funcMap[fKey].total++;
          if (isWeb) funcMap[fKey].web++; else funcMap[fKey].paper++;
        });

        // Involvement (Q5)
        (r.susts || []).forEach(s => {
          const sKey = shortSust(s);
          if (!sKey || sKey === '無回答') return;
          totalSustVotes++;
          if (!sustMap[sKey]) sustMap[sKey] = { label: sKey, total: 0, web: 0, paper: 0 };
          sustMap[sKey].total++;
          if (isWeb) sustMap[sKey].web++; else sustMap[sKey].paper++;
        });
      });

      const sortDesc = (obj) => Object.values(obj).sort((a, b) => b.total - a.total);

      return {
        total: rows.length,
        denom: total,
        webCount,
        paperCount,
        webPct: ((webCount / total) * 100).toFixed(1),
        paperPct: ((paperCount / total) * 100).toFixed(1),
        distCount: distSet.size,
        commentCount,
        webCommentCount,
        paperCommentCount,
        bldgValid: bldgValid || total,
        privValid: privValid || total,
        totalFuncVotes,
        totalSustVotes,
        bldgList: sortDesc(bldgMap),
        privList: sortDesc(privMap),
        funcList: sortDesc(funcMap),
        sustList: sortDesc(sustMap),
        ageList: sortDesc(ageMap),
        distList: sortDesc(distMap)
      };
    }

    function hBarDual(label, totalCount, denom, webCount, paperCount, colorClass = "bg-emerald-600", subtext = "") {
      const safeDenom = denom > 0 ? denom : 1;
      const pct = ((totalCount / safeDenom) * 100).toFixed(1);
      return `
        <div class="mb-2.5">
          <div class="flex flex-wrap justify-between items-baseline text-xs sm:text-sm mb-1 gap-1">
            <span class="font-bold text-slate-800">${label} ${subtext ? `<span class="text-xs text-slate-500 font-normal">${subtext}</span>` : ''}</span>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-500">(Web:${webCount} / 紙:${paperCount})</span>
              <span class="font-extrabold text-slate-900">${totalCount}件 <span class="text-xs font-extrabold text-emerald-700">(${pct}%)</span></span>
            </div>
          </div>
          <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
            <div class="h-full ${colorClass} rounded-full bar-fill" style="width: ${Math.min(100, pct)}%"></div>
          </div>
        </div>
      `;
    }

    function kpiCard(title, value, sub, badgeColor = "bg-emerald-600") {
      return `
        <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs flex flex-col justify-between">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="text-xs font-bold text-slate-500">${title}</span>
            <span class="w-2.5 h-2.5 rounded-full ${badgeColor}"></span>
          </div>
          <div class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight my-0.5 truncate" title="${value}">${value}</div>
          <div class="text-[11px] text-slate-500 leading-snug">${sub}</div>
        </div>
      `;
    }

    // ============================================================================
    // 3. スライド＆A4セクション生成（動的データ＋カスタム設定を反映）
    // ============================================================================
    function getSlides(audience, depth) {
      const st = computeDynamicStats(RAW_DATA);
      const topBldg = st.bldgList.filter(x => x.label !== '無回答')[0] || { label: '—', total: 0 };
      const secondBldg = st.bldgList.filter(x => x.label !== '無回答')[1] || { label: '—', total: 0 };
      const topFunc1 = st.funcList[0] || { label: '—', total: 0 };
      const topFunc2 = st.funcList[1] || { label: '—', total: 0 };
      const topFunc3 = st.funcList[2] || { label: '—', total: 0 };
      const topPriv1 = st.privList.filter(x => x.label !== '無回答')[0] || { label: '—', total: 0 };
      const topPriv2 = st.privList.filter(x => x.label !== '無回答')[1] || { label: '—', total: 0 };

      const topPrivPct = (((topPriv1.total + topPriv2.total) / st.privValid) * 100).toFixed(1);
      const topSust1Pct = ((topSust1.total / st.denom) * 100).toFixed(1);

      const subtitleText = appConfig.customSubtitle ||

      const colors = ["bg-emerald-600", "bg-blue-600", "bg-teal-500", "bg-amber-500", "bg-purple-500", "bg-rose-500", "bg-slate-400"];
      const slides = [];

      // SLIDE 1: Executive Overview
      slides.push({
        tag: audience === 'resident' ? `住民向け統合結果報告（全${st.total}件）` : `部会・協議会向け統合分析（全${st.total}件）`,
        title: audience === 'resident' ? appConfig.residentReportTitle : appConfig.stakeholderReportTitle,
        subtitle: subtitleText,
        content: `
          <div class="grid grid-cols-2 lg:grid-cols-6 gap-2.5 mb-4">

            ${kpiCard("問2 最多回答", `${topBldgPct}%`, `「${topBldg.label}」(${topBldg.total}件)`, "bg-teal-600")}
            ${kpiCard("問3 優先機能 1位", `${topFunc1Pct}%`, `「${topFunc1.label}」(${topFunc1.total}票)`, "bg-blue-600")}
            ${kpiCard("問4 上位2項合計", `${topPrivPct}%`, `1位:${topPriv1.label}(${topPriv1.total}件)`, "bg-amber-500")}
            ${kpiCard("問5 最多回答", `${topSust1Pct}%`, `「${topSust1.label}」(${topSust1.total}票)`, "bg-purple-600")}
            ${kpiCard("自由記述 記入数", `${st.commentCount}件`, `Web ${st.webCommentCount}件 ＋ 紙 ${st.paperCommentCount}件`, "bg-rose-500")}
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
              <h4 class="font-extrabold text-sm mb-2 text-emerald-700">📌 回答データ（N=${st.total}）の構造と属性の特徴</h4>
              <ul class="text-xs sm:text-sm space-y-1.5 text-slate-800 leading-relaxed">
                <li>・<b>Web回答（${st.webCount}件・${st.webPct}%）と紙回答（${st.paperCount}件・${st.paperPct}%）を統合：</b>デジタル層（現役・子育て世代中心）と紙回覧層（シニア・地区全世帯層）の双方の声を漏れなく反映しています。</li>
                <li>・<b>優先順位の明確な合意：</b>「${topFunc1.label}（${topFunc1.total}票）」「${topFunc2.label}（${topFunc2.total}票）」「${topFunc3.label}（${topFunc3.total}票）」の上位3項目に支持が集中しています。</li>
              </ul>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
              <h4 class="font-extrabold text-sm mb-2 text-blue-700">${audience === 'resident' ? '💡 アンケート全体から導かれた「地域の結論」' : '🧭 部会への総括提言（エグゼクティブ・インサイト）'}</h4>
              <p class="text-xs sm:text-sm leading-relaxed text-slate-800">
                ${audience === 'resident'
                  ? (appConfig.customResidentSummary || `将来の維持管理負担や草刈り等の限界を踏まえ、<b>「${topBldg.label}（${topBldg.total}件）」</b>を軸にコンパクト化を図りつつ、地域共通の願いである<b>「${topFunc1.label}」「${topFunc2.label}」「${topFunc3.label}」</b>を実現し、民間活力や利用料負担を組み合わせて無理なく支える方針が合意の軸となります。`)
                  : (appConfig.customStakeholderSummary || `全体データ（N=${st.total}）から導かれる最適解は、<b>「${topBldg.label}（${topBldgPct}%）」</b>による管理面積の適正化と、<b>「${topFunc1.label}（${topFunc1Pct}%）× ${topFunc2.label} × ${topFunc3.label}」</b>の複合拠点化です。さらに「${topPriv1.label}（${topPriv1.total}件）」と「${topSust1.label}（${topSust1.total}票）」を踏まえ、住民の無償奉仕に依存しない持続可能な運営設計が焦点となります。`)}
              </p>
            </div>
          </div>
        `
      });

      // SLIDE 2: 4 Core Questions Quantitative Breakdown
      slides.push({
        tag: `主要4設問の全体・Web・紙 比較集計（N=${st.total}）`,
        title: `${appConfig.qBldgLabel}・${appConfig.qFuncLabel}・${appConfig.qPrivLabel}・${appConfig.qSustLabel}`,
        subtitle: '各項目の得票数と割合（Web回答・紙回答の内訳つき）',
        content: `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
              <h4 class="font-extrabold text-sm mb-2.5">🏫 ${appConfig.qBldgLabel}（有効回答${st.bldgValid}件）</h4>
              ${st.bldgList.filter(x => x.label !== '無回答').slice(0, 6).map((item, i) =>
                hBarDual(item.label, item.total, st.bldgValid, item.web, item.paper, colors[i % colors.length])
              ).join('')}

              <h4 class="font-extrabold text-sm mt-4 mb-2.5 pt-3 border-t border-slate-200">🤝 ${appConfig.qPrivLabel}（有効回答${st.privValid}件）</h4>
              ${st.privList.filter(x => x.label !== '無回答').slice(0, 6).map((item, i) =>
                hBarDual(item.label, item.total, st.privValid, item.web, item.paper, colors[(i + 1) % colors.length])
              ).join('')}
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
              <h4 class="font-extrabold text-sm mb-2.5">🎯 ${appConfig.qFuncLabel}（延べ${st.totalFuncVotes}票 / 対${st.total}名比）</h4>
              ${st.funcList.slice(0, 6).map((item, i) =>
                hBarDual(item.label, item.total, st.denom, item.web, item.paper, colors[i % colors.length])
              ).join('')}

              <h4 class="font-extrabold text-sm mt-4 mb-2.5 pt-3 border-t border-slate-200">🌱 ${appConfig.qSustLabel}（延べ${st.totalSustVotes}票 / 対${st.total}名比）</h4>
              ${st.sustList.slice(0, 6).map((item, i) =>
                hBarDual(item.label, item.total, st.denom, item.web, item.paper, colors[(i + 2) % colors.length])
              ).join('')}
            </div>
          </div>
        `
      });

      // SLIDE 3 (Detailed): Attributes (Age & Districts)
      if (depth === 'detailed') {
        slides.push({
          tag: `回答者の属性分布（${appConfig.qAgeLabel} × ${appConfig.qDistLabel}）`,
          title: `どんな世代・どの地区から回答が集まったか？（N=${st.total}）`,
          subtitle: `${appConfig.qAgeLabel}（${st.ageList.length}区分）と ${appConfig.qDistLabel}（全${st.distCount}地区）の回答内訳`,
          content: `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                <h4 class="font-extrabold text-sm mb-3">👥 ${appConfig.qAgeLabel} 分布（N=${st.total}）</h4>
                ${st.ageList.slice(0, 9).map((item, i) =>
                  hBarDual(item.label, item.total, st.denom, item.web, item.paper, colors[i % colors.length])
                ).join('')}
              </div>
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                <h4 class="font-extrabold text-sm mb-3">📍 ${appConfig.qDistLabel} 分布（上位〜全地区）</h4>
                ${st.distList.slice(0, 9).map((item, i) =>
                  hBarDual(item.label, item.total, st.denom, item.web, item.paper, colors[(i + 1) % colors.length])
                ).join('')}
              </div>
            </div>
          `
        });
      }

      // SLIDE 4 (Stakeholder): Cross-Tabulation & Insights
      if (audience === 'stakeholder') {
        const bldgCols = st.bldgList.filter(x => x.label !== '無回答').slice(0, 3);
        const sustCols = st.sustList.slice(0, 4);
        const ageGroups = st.ageList.filter(x => x.label !== '無回答').slice(0, 7);

        const crossRowsHtml = ageGroups.map(ag => {
          const sub = RAW_DATA.filter(r => (r.age || '無回答') === ag.label);
          const n = sub.length || 1;
          const bCells = bldgCols.map(bc => {
            const c = sub.filter(r => shortBldg(r.bldg) === bc.label).length;
            return `<td class="py-1.5 px-2 text-center">${c} (${Math.round((c/n)*100)}%)</td>`;
          }).join('');
          const sCells = sustCols.map(sc => {
            const c = sub.filter(r => (r.susts || []).map(shortSust).includes(sc.label)).length;
            return `<td class="py-1.5 px-2 text-center">${c}票 (${Math.round((c/n)*100)}%)</td>`;
          }).join('');
          return `
            <tr>
              <td class="py-1.5 px-2 font-bold">${ag.label}</td>
              <td class="py-1.5 px-2 text-center font-mono">${ag.total}件 (${ag.web}/${ag.paper})</td>
              ${bCells}
              ${sCells}
            </tr>
          `;
        }).join('');

        slides.push({
          tag: '属性別クロス分析＆構造的インサイト（部会・関係者用）',
          title: `${appConfig.qAgeLabel} × ${appConfig.qBldgLabel} ＆ ${appConfig.qSustLabel} クロス集計表`,
          subtitle: '回答者の世代・属性による意向の違いと、合意形成に向けた構造的インサイト',
          content: `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

                      <th class="py-2 px-2">${appConfig.qAgeLabel}</th>
                      <th class="py-2 px-2 text-center">回答数 (Web/紙)</th>
                      ${bldgCols.map(b => `<th class="py-2 px-2 text-center bg-emerald-500/10">【問2】${b.label}</th>`).join('')}

                  </thead>

                </table>

              <div class="lg:col-span-6 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs leading-relaxed">
                <b class="text-emerald-800">💡 相関インサイト①（方針と負担感のギャップ解消）：</b><br>
                全体では<b>「${topBldg.label}（${topBldg.total}件）」</b>が第1位、<b>「${secondBldg.label}（${secondBldg.total}件）」</b>が第2位となっています。また関わり方では<b>「${topSust1.label}（${topSust1.total}票）」</b>が最多であることから、維持管理面積のスリム化（減築・選択と集中）が合意形成の大前提となります。
              </div>
              <div class="lg:col-span-6 p-3.5 rounded-xl bg-blue-50 border border-blue-200 text-xs leading-relaxed">
                <b class="text-blue-800">💡 相関インサイト②（優先機能×民間連携のハイブリッド設計）：</b><br>
                上位ニーズである<b>「${topFunc1.label}（${topFunc1.total}票）」「${topFunc2.label}（${topFunc2.total}票）」「${topFunc3.label}（${topFunc3.total}票）」</b>を公共コモンズとして確保した上で、<b>「${topPriv1.label}（${topPriv1.total}件）」</b>の条件を協定化し、民間活力や受益者負担を組み合わせる運営モデルが有効です。
              </div>
            </div>
          `
        });
      }

      // SLIDE 5: Free Comments & Discussion Questions
      const commentsWithText = RAW_DATA.filter(r => r.comment && String(r.comment).trim());
      slides.push({
        tag: `${appConfig.qCommentLabel}（全${commentsWithText.length}件）と今後の討議アジェンダ`,
        title: audience === 'stakeholder'
          ? `自由記述（${commentsWithText.length}件）の主要ボイスと、部会で合意すべき「討議の問い」`
          : `寄せられたご意見（${commentsWithText.length}件）の抜粋と、今後の話し合いの進め方`,
        subtitle: `「${topFunc1.label}」「${topFunc2.label}」「${topFunc3.label}」の実現と、無理のない維持管理体制の構築に向けて`,
        content: `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            ${commentsWithText.slice(0, 6).map(r => `
              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1">
                <div class="flex items-center justify-between font-bold text-emerald-700">
                  <span>[#${r.id} / ${r.source}] ${r.age || ''}・${r.dist || ''}</span>
                  <span class="text-slate-500">${shortBldg(r.bldg)}</span>
                </div>
                <p class="text-slate-800 leading-relaxed">${r.comment}</p>
              </div>
            `).join('')}
          </div>
          <div class="p-4 rounded-xl bg-emerald-950 text-white text-xs sm:text-sm space-y-1.5">
            <div class="font-extrabold text-amber-300">🧭 次回の部会・対話の場で合意形成を図る「3つの重要アジェンダ（問い）」</div>

    function renderA4(audience, depth) {

        <div class="a4-container max-w-4xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-10">

              <div class="text-xs font-bold text-emerald-700 mb-1">${badge} ${depthLabel}</div>

    function renderSlides(audience, depth) {
      const st = computeDynamicStats(RAW_DATA);

      if (state.slideIndex >= slides.length) state.slideIndex = 0;

      if (indicator) indicator.textContent = `${state.slideIndex + 1} / ${slides.length}`;

      return `
        <div class="space-y-6">
          ${listToRender.map((s, idx) => {
            const actualIndex = state.showAllSlides ? idx : state.slideIndex;

    function getFieldValues(row, field) {
      if (field === 'source') return [(row.source || 'Web') + '回答'];
      if (field === 'age') return [row.age || '無回答'];
      if (field === 'dist') return [row.dist || '無回答'];
      if (field === 'bldg') return [shortBldg(row.bldg)];
      if (field === 'priv') return [shortPriv(row.priv)];
      if (field === 'funcs') return (row.funcs && row.funcs.length) ? row.funcs.map(shortFunc) : ['無回答'];
      if (field === 'susts') return (row.susts && row.susts.length) ? row.susts.map(shortSust) : ['無回答'];
      return [];
    }

      ];

      const subset = RAW_DATA.filter(r => state.pivotChannel === 'ALL' || r.source === state.pivotChannel);

      const xSet = new Set();
      const ySet = new Set();
      const matrix = {};
      let maxCell = 1;

      subset.forEach(r => {
        const xs = getFieldValues(r, state.pivotX);
        const ys = getFieldValues(r, state.pivotY);
        xs.forEach(x => xSet.add(x));
        ys.forEach(y => ySet.add(y));
        ys.forEach(y => {
          if (!matrix[y]) matrix[y] = {};
          xs.forEach(x => {
            matrix[y][x] = (matrix[y][x] || 0) + 1;
            if (matrix[y][x] > maxCell) maxCell = matrix[y][x];
          });
        });
      });

      const xList = Array.from(xSet);
      const yList = Array.from(ySet);

      const filteredRows = RAW_DATA.filter(r => {
        if (state.filterSource !== 'ALL' && r.source !== state.filterSource) return false;

        if (state.searchQuery) {

          if (!blob.includes(q)) return false;

      return `

                <div>

                    <option value="ALL" ${state.pivotChannel === 'ALL' ? 'selected' : ''}>全体統合 (N=${st.total})</option>
                    <option value="Web" ${state.pivotChannel === 'Web' ? 'selected' : ''}>Web回答のみ (n=${st.webCount})</option>
                    <option value="紙" ${state.pivotChannel === '紙' ? 'selected' : ''}>紙回答のみ (n=${st.paperCount})</option>
                  </select>
                </div>
                <div>
                  <label class="block font-bold mb-1 text-slate-500">縦軸（行・Y軸）:</label>
                  <select onchange="updatePivotY(this.value)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-bold">
                    ${fields.map(f => `<option value="${f.key}" ${state.pivotY === f.key ? 'selected' : ''}>${f.label}</option>`).join('')}
                  </select>
                </div>
                <div class="font-bold text-base pt-4">×</div>
                <div>
                  <label class="block font-bold mb-1 text-slate-500">横軸（列・X軸）:</label>
                  <select onchange="updatePivotX(this.value)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-bold">
                    ${fields.map(f => `<option value="${f.key}" ${state.pivotX === f.key ? 'selected' : ''}>${f.label}</option>`).join('')}
                  </select>
                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-xs border-collapse border border-slate-200">
                <thead>
                  <tr class="bg-slate-100">
                    <th class="p-2.5 border border-slate-200 text-left">縦軸 ＼ 横軸</th>
                    ${xList.map(x => `<th class="p-2.5 border border-slate-200 text-center font-bold">${x}</th>`).join('')}
                    <th class="p-2.5 border border-slate-200 text-center font-bold bg-emerald-50">行合計</th>
                  </tr>
                </thead>
                <tbody>
                  ${yList.map(y => {
                    let rowSum = 0;
                    const cells = xList.map(x => {
                      const val = (matrix[y] && matrix[y][x]) ? matrix[y][x] : 0;
                      rowSum += val;
                      const alpha = val > 0 ? (0.12 + (val / maxCell) * 0.58).toFixed(2) : 0;
                      const bgStyle = val > 0 ? `background-color: rgba(16, 185, 129, ${alpha});` : '';
                      return `<td class="p-2.5 border border-slate-200 text-center font-mono ${val > 0 ? 'font-bold' : 'text-slate-400'}" style="${bgStyle}">${val}</td>`;

                      </tr>

                </tbody>
              </table>
            </div>
          </div>

          <!-- Raw Data Explorer -->
          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">

                  <option value="Web" ${state.filterSource === 'Web' ? 'selected' : ''}>Web回答(${st.webCount})</option>
                  <option value="紙" ${state.filterSource === '紙' ? 'selected' : ''}>紙回答(${st.paperCount})</option>
                </select>
                <select onchange="updateFilterAge(this.value)" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
                  ${ages.map(a => `<option value="${a}" ${state.filterAge === a ? 'selected' : ''}>${a === 'ALL' ? 'すべての年代/属性1' : a}</option>`).join('')}
                </select>
                <select onchange="updateFilterDist(this.value)" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
                  ${dists.map(d => `<option value="${d}" ${state.filterDist === d ? 'selected' : ''}>${d === 'ALL' ? 'すべての地区/属性2' : d}</option>`).join('')}
                </select>
                <input type="text" placeholder="自由記述・キーワード検索..." value="${state.searchQuery}" oninput="updateSearch(this.value)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white w-56" />
                <span class="font-bold text-emerald-700 ml-1">該当：${filteredRows.length}件</span>
              </div>
            </div>

            <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
              <table class="w-full text-xs border-collapse">
                <thead class="sticky top-0 bg-slate-100 shadow-2xs">
                  <tr class="border-b-2 border-slate-200 text-slate-600 text-left">
                    <th class="py-2 px-2">No</th>

                    <th class="py-2 px-2">${appConfig.qPrivLabel}</th>
                    <th class="py-2 px-2">${appConfig.qSustLabel}</th>
                    <th class="py-2 px-2">${appConfig.qCommentLabel}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filteredRows.map(r => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2 px-2 font-mono font-bold">#${r.id}</td>
                      <td class="py-2 px-2 whitespace-nowrap"><span class="px-1.5 py-0.5 rounded font-bold ${r.source === 'Web' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-800'}">${r.source}</span></td>
                      <td class="py-2 px-2 whitespace-nowrap">${r.age}</td>
                      <td class="py-2 px-2 whitespace-nowrap font-bold">${r.dist}</td>
                      <td class="py-2 px-2">${shortBldg(r.bldg)}</td>
                      <td class="py-2 px-2">${(r.funcs||[]).map(f => `<span class="inline-block px-1.5 py-0.5 m-0.5 rounded bg-slate-100 border border-slate-200">${shortFunc(f)}</span>`).join('')}</td>
                      <td class="py-2 px-2">${shortPriv(r.priv)}</td>
                      <td class="py-2 px-2">${(r.susts||[]).map(s => `<span class="inline-block px-1.5 py-0.5 m-0.5 rounded bg-emerald-50 text-emerald-800 font-medium">${shortSust(s)}</span>`).join('')}</td>
                      <td class="py-2 px-2 max-w-xs ${r.comment ? 'font-medium text-slate-900 bg-amber-50/60' : 'text-slate-400'}">${r.comment || '—'}</td>

    function toEmbedFormUrl(url) {
      if (!url) return "";
      const u = url.trim();
      if (u.includes("embedded=true")) return u;
      if (u.includes("/viewform")) return u.split("?")[0] + "?embedded=true";
      return u;
    }

    // ============================================================================
    // 5. Googleスプレッドシート & CSV インポート機能（JSONP方式でCORS完全回避）
    // ============================================================================
    function parseFlexibleSurveyRows(headers, rawRows) {
      const findCol = (customIdx, keywords, fallbackIdx) => {
        if (typeof customIdx === 'number' && customIdx >= 0 && customIdx < headers.length) return customIdx;
        const idx = headers.findIndex(h => keywords.some(k => String(h || '').includes(k)));
        return idx >= 0 ? idx : fallbackIdx;
      };

      const idxSource = findCol(appConfig.colSource, ['経路', '媒体', '区分', 'Web', '紙', 'source', '回答方法'], -1);
      const idxAge    = findCol(appConfig.colAge,    ['年代', '年齢', '問1-1', '属性1'], 1);
      const idxDist   = findCol(appConfig.colDist,   ['地区', '自治会', 'お住まい', '問1-2', '居住', '属性2'], 2);
      const idxBldg   = findCol(appConfig.colBldg,   ['建物', '校舎', '扱い', '方向性', '問2', '自慢', '誇り'], 3);
      const idxFunc   = findCol(appConfig.colFunc,   ['機能', '優先', '問3', 'したい', '期待', 'あったら'], 4);
      const idxPriv   = findCol(appConfig.colPriv,   ['民間', '企業', '誘致', '参入', '問4'], 5);
      const idxSust   = findCol(appConfig.colSust,   ['関わり', '負担', '参加', '維持', '問5', '不安', '課題'], 6);
      const idxComm   = findCol(appConfig.colComment,['自由', '意見', 'アイデア', 'その他', 'コメント', '記述'], Math.max(7, headers.length - 1));

      const splitMulti = (val) => {
        if (!val) return [];
        const s = String(val).trim();
        if (!s || s === '無回答') return [];
        // 選択肢内の括弧「（...）」の中の読点は分割しないよう、セミコロン・改行・または括弧外のカンマで分割
        return s.split(/[;
]|,(?![^（(]*[）)])/).map(x => x.trim()).filter(Boolean);
      };

      const records = [];
      rawRows.forEach((cols, i) => {
        if (!cols || cols.every(c => !String(c || '').trim())) return;
        const rawSrc = idxSource >= 0 ? String(cols[idxSource] || '') : '';
        const source = (rawSrc.includes('紙') || rawSrc.toLowerCase().includes('paper')) ? '紙' : 'Web';
        records.push({
          id: i + 1,
          source,
          age: String(cols[idxAge] || '無回答').trim() || '無回答',
          dist: String(cols[idxDist] || '無回答').trim() || '無回答',
          bldg: String(cols[idxBldg] || '無回答').trim() || '無回答',
          funcs: splitMulti(cols[idxFunc]),
          priv: String(cols[idxPriv] || '無回答').trim() || '無回答',
          susts: splitMulti(cols[idxSust]),
          comment: String(cols[idxComm] || '').trim()
        });
      });

      return records;
    }

    function syncFromGoogleSheet(urlOverride, sheetArgOverride) {
      const targetUrl = (urlOverride !== undefined ? urlOverride : appConfig.sheetUrl).trim();
      const targetSheet = (sheetArgOverride !== undefined ? sheetArgOverride : appConfig.sheetNameOrGid).trim();

      if (!targetUrl) {
        showToast("⚠️ GoogleスプレッドシートのURLを入力してください");
        return;
      }

      // もしGoogleフォームのURLが貼られた場合はフォームURLとして保存し案内を表示
      if (targetUrl.includes("/forms/")) {
        appConfig.formUrl = targetUrl;
        saveConfig();
        closeModal();
        setFormat('form');
        showToast("✅ GoogleフォームURLを登録しました（回答受付タブを表示中）");
        return;
      }

      const idMatch = targetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (!idMatch) {
        showToast("⚠️ 有効なGoogleスプレッドシートURLではありません");
        return;
      }
      const sheetId = idMatch[1];
      const urlGidMatch = targetUrl.match(/[#&?]gid=([0-9]+)/);

      appConfig.sheetUrl = targetUrl;
      appConfig.sheetNameOrGid = targetSheet;
      saveConfig();

      showToast("🔄 Googleスプレッドシートからデータを取得中...");

      const cbName = "gvizCb_" + Math.floor(Math.random() * 1000000);
      let queryParam = "";
      if (targetSheet && /^\d+$/.test(targetSheet)) {
        queryParam = `&gid=${targetSheet}`;
      } else if (targetSheet) {
        queryParam = `&sheet=${encodeURIComponent(targetSheet)}`;
      } else if (urlGidMatch) {
        queryParam = `&gid=${urlGidMatch[1]}`;
      }

      window[cbName] = function(response) {
        delete window[cbName];
        const sc = document.getElementById(cbName);
        if (sc) sc.remove();

        if (!response || !response.table || !response.table.rows) {
          showToast("⚠️ データ取得失敗：スプレッドシートの共有設定を「リンクを知っている全員」にしてください");
          return;
        }

        const colsInfo = response.table.cols || [];
        const labelHeaders = colsInfo.map(c => c ? String(c.label || '').trim() : '');
        const allRows = response.table.rows.map(r =>
          (r.c || []).map(cell => cell ? String(cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : '')).trim() : '')
        );

        let headers = labelHeaders;
        let dataRows = allRows;
        if (labelHeaders.filter(Boolean).length <= 1 && allRows.length > 1) {
          headers = allRows[0];
          dataRows = allRows.slice(1);
        }

        state.lastHeaders = headers;
        const parsed = parseFlexibleSurveyRows(headers, dataRows);
        if (parsed.length === 0) {
          showToast("⚠️ 有効な回答行が見つかりませんでした");
          return;
        }

        appConfig.lastSyncAt = new Date().toLocaleString('ja-JP');
        saveConfig();
        saveData(parsed);
        closeModal();
        render();
        showToast(`✅ スプレッドシートから全 ${parsed.length} 件のデータを取り込みました！`);
      };

      const script = document.createElement('script');
      script.id = cbName;
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${cbName}${queryParam}`;
      script.onerror = function() {
        delete window[cbName];
        script.remove();
        showToast("⚠️ 通信エラー：URLまたは共有権限（「リンクを知っている全員が閲覧可」）を確認してください");
      };
      document.body.appendChild(script);
    }

    function parseCsvTextToRows(text) {
      const sep = text.includes('\t') ? '\t' : ',';
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      const parseLine = (line) => {
        const res = [];
        let cur = '';
        let inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQ = !inQ;
          } else if (ch === sep && !inQ) {
            res.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        res.push(cur.trim());
        return res;
      };
      return lines.map(parseLine);
    }

    function handleCsvFileUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = String(e.target.result || '');
        const rows = parseCsvTextToRows(text);
        if (rows.length < 2) {
          showToast("⚠️ CSVの行数が不足しています");
          return;
        }
        state.lastHeaders = rows[0];
        const parsed = parseFlexibleSurveyRows(rows[0], rows.slice(1));
        appConfig.lastSyncAt = new Date().toLocaleString('ja-JP') + ` (${file.name})`;
        saveConfig();
        saveData(parsed);
        closeModal();
        render();
        showToast(`✅ CSVファイルから全 ${parsed.length} 件を取り込みました！`);
      };
      reader.readAsText(file);
    }

      if (docTitle) docTitle.textContent = appConfig.appTitle;
      const badgeEl = document.getElementById('header-badge-icon');
      if (badgeEl) badgeEl.textContent = appConfig.badgeText || '河';
      const titleEl = document.getElementById('header-app-title');
      if (titleEl) titleEl.textContent = appConfig.appTitle;
      const subEl = document.getElementById('header-app-subtitle');
      if (subEl) {
        subEl.innerHTML = appConfig.customSubtitle
          ? appConfig.customSubtitle
          : `総回答数 <b>N=${st.total}</b>（Web回答：${st.webCount}件［${st.webPct}%］＋ 紙回答：${st.paperCount}件［${st.paperPct}%］｜全${st.distCount}地区・自由記述${st.commentCount}件）`;
      }

      ['slide', 'a4', 'explorer', 'form'].forEach(fmt => {
        const el = document.getElementById('btn-fmt-' + fmt);
        if (el) el.className = `px-2.5 py-1.5 rounded-md font-bold transition cursor-pointer ${state.format === fmt ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-700 hover:bg-white'}`;
      });
      ['resident', 'stakeholder'].forEach(aud => {
        const el = document.getElementById('btn-aud-' + aud);
        if (el) el.className = `px-2.5 py-1.5 rounded-md font-bold transition cursor-pointer ${state.audience === aud ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-700 hover:bg-white'}`;
      });
      ['digest', 'detailed'].forEach(dep => {
        const el = document.getElementById('btn-dep-' + dep);
        if (el) el.className = `px-2.5 py-1.5 rounded-md font-bold transition cursor-pointer ${state.depth === dep ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-700 hover:bg-white'}`;
      });

      const slideControls = document.getElementById('slide-controls');
      const audGroup = document.getElementById('audience-group');
      const depGroup = document.getElementById('depth-group');

      if (state.format === 'explorer' || state.format === 'form') {
        if (slideControls) slideControls.style.display = 'none';
        if (audGroup) audGroup.style.opacity = '0.4';
        if (depGroup) depGroup.style.opacity = '0.4';
      } else if (state.format === 'a4') {
        if (slideControls) slideControls.style.display = 'none';
        if (audGroup) audGroup.style.opacity = '1';
        if (depGroup) depGroup.style.opacity = '1';
      } else {
        if (slideControls) slideControls.style.display = 'flex';
        if (audGroup) audGroup.style.opacity = '1';
        if (depGroup) depGroup.style.opacity = '1';
      }

      const mount = document.getElementById('main-mount');
      if (state.format === 'explorer') {
        mount.innerHTML = renderExplorer();
      } else if (state.format === 'form') {
        mount.innerHTML = renderFormView();
      } else if (state.format === 'a4') {
        mount.innerHTML = renderA4(state.audience, state.depth);
      } else {
        mount.innerHTML = renderSlides(state.audience, state.depth);
      }
    }

    function setFormat(fmt) { state.format = fmt; state.slideIndex = 0; render(); }
    function setAudience(aud) { if (state.format === 'explorer' || state.format === 'form') state.format = 'slide'; state.audience = aud; state.slideIndex = 0; render(); }
    function setDepth(dep) { if (state.format === 'explorer' || state.format === 'form') state.format = 'slide'; state.depth = dep; state.slideIndex = 0; render(); }
    function selectPreset(fmt, aud, dep) { state.format = fmt; state.audience = aud; state.depth = dep; state.slideIndex = 0; render(); }
    function prevSlide() { const len = getSlides(state.audience, state.depth).length; state.slideIndex = (state.slideIndex - 1 + len) % len; render(); }
    function nextSlide() { const len = getSlides(state.audience, state.depth).length; state.slideIndex = (state.slideIndex + 1) % len; render(); }
    function goToSlide(idx) { state.slideIndex = idx; render(); }
    function toggleAllSlides() {
      state.showAllSlides = !state.showAllSlides;
      const btn = document.getElementById('btn-slide-all');
      if (btn) btn.textContent = state.showAllSlides ? '1枚ずつ表示に戻す' : '一覧表示に切替';
      render();
    }
    function updatePivotChannel(val) { state.pivotChannel = val; render(); }
    function updatePivotX(val) { state.pivotX = val; render(); }
    function updatePivotY(val) { state.pivotY = val; render(); }
    function updateFilterSource(val) { state.filterSource = val; render(); }
    function updateFilterAge(val) { state.filterAge = val; render(); }
    function updateFilterDist(val) { state.filterDist = val; render(); }
    function updateSearch(val) { state.searchQuery = val; render(); }

    window.addEventListener('keydown', (e) => {
      if (state.format === 'slide' && !state.showAllSlides) {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      }
    });

    render();
  </script>
</body>
</html>
